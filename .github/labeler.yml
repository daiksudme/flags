# Version-affecting labels are derived only from the pull request head branch, so a path
# match can never manufacture a SemVer impact the author did not choose. Product Release is
# decided in this repository's registry, so no branch name gates a release.
'BREAKING CHANGE':
  - head-branch: ['^breaking-change/(?:feat|perf|fix)/']

DEPRECATED:
  - head-branch: ['^deprecated/(?:feat|perf|fix)/']

feat:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?feat/']

perf:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?perf/']

fix:
  - head-branch: ['^(?:(?:breaking-change|deprecated)/)?fix/']

revert:
  - head-branch: ['^revert/']

# Non-versioning classification: any PR that changes a flag's declared state, regardless of
# branch name, touched the one thing this repository exists for.
flags:
  - changed-files:
      - any-glob-to-all-files: ['registry/**']

# These labels never affect the version. A path rule uses one combined all-files glob, so a
# code change with an incidental docs or test edit is not reclassified.
docs:
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-all-files: ['{docs/**,**/*.md,**/*.mdx}']

refactor:
  - head-branch: ['^refactor/']

style:
  - head-branch: ['^style/']

test:
  - any:
      - head-branch: ['^test/']
      - changed-files:
          - any-glob-to-all-files: ['{test/**,tests/**,**/*.test.*,**/*.spec.*}']

build:
  - any:
      - head-branch: ['^build/']
      - changed-files:
          - any-glob-to-all-files:
              ['{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,tsconfig.json}']

ci:
  - any:
      - head-branch: ['^ci/']
      - changed-files:
          - any-glob-to-all-files: ['.github/{workflows/**,scripts/**,*.yml}']

chore:
  - head-branch: ['^chore/']
