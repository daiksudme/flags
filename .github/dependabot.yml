version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: 'ci(actions)'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
