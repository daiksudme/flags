apiVersion: gh-infra/v1
kind: Repository
metadata:
  owner: daiksudme
  name: flags

# Additive reconciliation deliberately preserves GitHub's default labels and
# any unrelated rulesets managed outside this repository.
reconcile:
  labels: additive
  rulesets: additive

spec:
  description: Feature flag registry of record for the daiksudme services, synced to Cloudflare Flagship
  topics: [feature-flags, cloudflare-flagship, adr, gherkin, specification]
  visibility: public
  archived: false

  labels:
    - name: BREAKING CHANGE
      description: Backward-incompatible registry schema change (MAJOR; MINOR under 0.y.z)
      color: b60205
    - name: DEPRECATED
      description: Behavior marked for future removal (MINOR)
      color: fbca04
    - name: build
      description: Build system or external dependency changes
      color: a8aeb4
    - name: chore
      description: Repository maintenance with no product behavior change
      color: ededed
    - name: ci
      description: CI configuration and automation changes
      color: cfd3d7
    - name: docs
      description: Documentation-only changes
      color: c4b5e0
    - name: feat
      description: A new feature (MINOR)
      color: 0e8a16
    - name: fix
      description: A bug fix (PATCH)
      color: 0052cc
    - name: flags
      description: A flag's declared state changed (registry/**)
      color: 5319e7
    - name: perf
      description: A performance improvement (MINOR)
      color: 7fd18a
    - name: refactor
      description: Code restructuring with no behavior change
      color: 8ec9cc
    - name: revert
      description: Reverts a previously synced flag state (PATCH)
      color: 79b8ff
    - name: style
      description: Non-semantic style changes
      color: b5dcde
    - name: test
      description: Test additions and corrections
      color: d8ecec

  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES

  release_immutability: true

  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true

  rulesets:
    - name: protect-main
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include: [~DEFAULT_BRANCH]
      rules:
        pull_request:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: true
        required_status_checks:
          strict_required_status_checks_policy: true
          contexts:
            - context: CI success
              app: github-actions
            - context: Policy success
              app: github-actions
        non_fast_forward: true
        deletion: true
        required_linear_history: true
        required_signatures: true
    - name: protect-sync-tags
      target: tag
      enforcement: active
      bypass_actors:
        - app: github-actions
          bypass_mode: always
      conditions:
        ref_name:
          include: ['refs/tags/v*']
      rules:
        non_fast_forward: true
        deletion: true
        creation: true
        required_linear_history: false
        required_signatures: false

  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: false
    fork_pr_approval: first_time_contributors
