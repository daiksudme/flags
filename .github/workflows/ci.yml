name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  policy:
    name: Policy success
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - name: Test policy rules
        run: node --test .github/scripts/*.test.mjs
      # A squash merge turns the pull request title into the commit subject, so the title is
      # what decides whether this branch carries the version bump it is required to carry.
      - name: Validate the version bump against the pull request title
        if: github.event_name == 'pull_request'
        run: node .github/scripts/policy.mjs pull-request
      - name: Validate every flag descriptor in the registry
        run: node .github/scripts/policy.mjs repository
      # The runtime fail-closed evaluation in each consumer is the real guarantee; this is a
      # belt-and-suspenders pre-merge gate so a flag is never turned on for a capability that
      # has not actually shipped yet.
      - name: Verify declared consumers are ready for any flag this change turns on
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/verify-consumers.mjs

  ci:
    name: CI success
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate pull request title and commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_status=0
          commits_status=0

          printf '%s\n' '::group::Pull request title'
          printf '%s\n' "$PR_TITLE" | pnpm lint:commit --verbose || title_status=$?
          printf '%s\n' '::endgroup::'

          printf '%s\n' '::group::Pull request commits'
          pnpm lint:commit --from "$BASE_SHA" --to "$HEAD_SHA" --verbose || commits_status=$?
          printf '%s\n' '::endgroup::'

          if ((title_status != 0 || commits_status != 0)); then
            exit 1
          fi
      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            commit_range="$HEAD_SHA"
            printf '%s\n' 'Previous revision is all-zero; validating all reachable history.'
          elif ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            commit_range="$HEAD_SHA"
            printf '%s\n' 'Previous revision is unavailable; validating all reachable history.'
          elif git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"; then
            commit_range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            commit_range="$HEAD_SHA"
            printf '%s\n' 'Non-fast-forward push detected; validating all reachable history.'
          fi

          commit_list="$RUNNER_TEMP/commitlint-shas"
          git rev-list --reverse "$commit_range" > "$commit_list"
          if [[ ! -s "$commit_list" ]]; then
            printf '%s\n' 'No commits were found in the validation range.' >&2
            exit 1
          fi
          while IFS= read -r commit_sha; do
            subject=$(git show -s --format='%s' "$commit_sha")
            read -r -a parents <<< "$(git show -s --format='%P' "$commit_sha")"
            if ((${#parents[@]} == 2)) &&
              [[ "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\ [^[:space:]]+$ ]]; then
              printf 'Skipping GitHub-style pull request merge %s\n' "$commit_sha"
              continue
            fi
            git show -s --format='%B' "$commit_sha" | pnpm lint:commit --verbose
          done < "$commit_list"
      - run: pnpm format:check
      - run: pnpm lint
